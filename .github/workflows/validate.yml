name: Source-only contract checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static documentation example
        run: python3 scripts/check_project.py
      - name: Run dependency-free contract tests
        run: python3 -m unittest discover -s tests -v
